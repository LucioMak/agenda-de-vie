name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Dépendances
        run: npm ci

      - name: Appli web
        run: npm run build

      - name: Projet Android
        run: |
          npx cap add android
          bash ci/patch-android.sh
          npx cap sync android

      - name: Clé de signature fixe (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AgendaDeVie.apk

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Agenda de vie 1.0.${{ github.run_number }}
          body: Télécharge AgendaDeVie.apk depuis ton téléphone et installe-le.
          files: AgendaDeVie.apk
          make_latest: true
